<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOTIMPHISHGUARD — YouTube Download</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="wrap wrap-narrow" style="padding-top:30px;">
    <div class="card" style="padding:24px;">
      <h1 class="gradient-text" style="font-size:20px;">BOTIMPHISHGUARD — YouTube Download</h1>
      <p class="sub" id="info" style="margin-top:8px;">Loading video…</p>
      <div id="preview" style="margin-top:14px;display:none;">
        <img id="thumb" style="width:100%;max-width:480px;border-radius:8px;border:1px solid #23455f;">
        <h3 id="title" style="margin:10px 0 6px;font-size:16px;"></h3>
        <p class="sub" id="duration" style="font-size:12px;"></p>
      </div>
      <div id="actions" style="margin-top:16px;display:none;gap:10px;flex-wrap:wrap;">
        <button id="dl-video" class="btn-primary" style="padding:10px 18px;">⬇ Download Video (mp4)</button>
        <button id="dl-audio" class="btn-primary" style="padding:10px 18px;background:#1d3a55;">♫ Download Audio (mp3)</button>
      </div>
      <p class="sub" id="status" style="margin-top:12px;font-size:12px;"></p>
      <p class="sub" style="font-size:11px;margin-top:14px;">Tip: Download buttons are added by BOTIMPHISHGUARD on every YouTube watch page. This page also works standalone — paste any YouTube URL.</p>
      <div style="margin-top:16px;">
        <input id="input-url" type="text" placeholder="Paste YouTube URL here" style="width:100%;padding:10px;border-radius:6px;background:#132a41;color:#eaf2ff;border:1px solid #23455f;">
        <button id="load" class="btn-primary" style="margin-top:8px;padding:8px 14px;">Load</button>
      </div>
    </div>
  </main>
  <script>
  (function(){
    var params = new URLSearchParams(window.location.search);
    var url = params.get("url") || params.get("vid") && ("https://www.youtube.com/watch?v="+params.get("vid")) || "";
    var format = params.get("format") || "mp4";
    var input = document.getElementById("input-url");
    var info = document.getElementById("info");
    var status = document.getElementById("status");
    if (url) input.value = url;
    function load(u){
      if (!u) { info.textContent = "Paste a YouTube URL above."; return; }
      info.textContent = "Fetching info for " + u + " …";
      document.getElementById("preview").style.display="none";
      document.getElementById("actions").style.display="none";
      fetch("/api/youtube/info?url=" + encodeURIComponent(u)).then(function(r){
        if (!r.ok) throw new Error("HTTP "+r.status);
        return r.json();
      }).then(function(j){
        info.textContent = "Ready — choose download format";
        document.getElementById("title").textContent = j.title || u;
        document.getElementById("duration").textContent = (j.duration ? "Duration: " + j.duration + "s" : "") + (j.uploader ? " • " + j.uploader : "");
        if (j.thumbnail) { document.getElementById("thumb").src = j.thumbnail; document.getElementById("preview").style.display=""; }
        else document.getElementById("preview").style.display="";
        document.getElementById("actions").style.display="flex";
        document.getElementById("dl-video").onclick = function(){
          status.textContent = "Starting video download…";
          window.location.href = "/api/youtube/download?url=" + encodeURIComponent(u) + "&format=mp4";
          setTimeout(function(){ status.textContent = "If download didn't start, try again or check pop-up blocker."; }, 2000);
        };
        document.getElementById("dl-audio").onclick = function(){
          status.textContent = "Starting audio download…";
          window.location.href = "/api/youtube/download?url=" + encodeURIComponent(u) + "&format=mp3";
          setTimeout(function(){ status.textContent = "If download didn't start, try again."; }, 2000);
        };
        // auto-trigger if format specified and user came from button
        if (format === "mp3") {
          // don't auto, let user click
        }
      }).catch(function(e){
        info.textContent = "Could not fetch info: " + e.message;
        status.textContent = "Try opening directly: https://www.y2mate.com/youtube/" + (u.split("v=")[1]||"");
        // fallback: still show buttons that go to external service
        document.getElementById("actions").style.display="flex";
        document.getElementById("dl-video").onclick = function(){ window.open("https://www.ssyoutube.com/watch?v=" + (new URL(u).searchParams.get("v")||""), "_blank"); };
        document.getElementById("dl-audio").onclick = function(){ window.open("https://www.ssyoutube.com/watch?v=" + (new URL(u).searchParams.get("v")||"") , "_blank"); };
      });
    }
    if (url) load(url);
    document.getElementById("load").addEventListener("click", function(){ load(document.getElementById("input-url").value.trim()); });
  })();
  </script>
</body>
</html>
