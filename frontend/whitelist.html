<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOTIMPHISHGUARD — Add to whitelist</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="wrap wrap-narrow" style="padding-top:30px;">
    <div class="card" style="padding:24px;">
      <h1 class="gradient-text" style="font-size:20px;">Add trusted site to whitelist</h1>
      <p class="sub" style="margin-top:8px;">If BOTIMPHISHGUARD blocks a site you trust, add it here. It will be allowed instantly (even betting sites). You need to be logged in.</p>
      <div style="margin-top:16px;">
        <label style="font-size:13px;">Domain (example.com, sub.example.com, or paste the full URL)</label>
        <input id="domain" type="text" placeholder="example.com" style="width:100%;padding:10px;border-radius:6px;background:#132a41;color:#eaf2ff;border:1px solid #23455f;margin-top:6px;">
      </div>
      <div style="margin-top:12px;">
        <label style="font-size:13px;">Notes (optional)</label>
        <input id="notes" type="text" placeholder="Why you trust it" style="width:100%;padding:10px;border-radius:6px;background:#132a41;color:#eaf2ff;border:1px solid #23455f;margin-top:6px;">
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;">
        <button id="add" class="btn-primary" style="padding:10px 18px;">Add to whitelist</button>
        <a href="/app/index.html" class="btn-primary" style="padding:10px 18px;background:#1d3a55;text-decoration:none;">Back to console</a>
      </div>
      <div id="msg" style="margin-top:12px;font-size:13px;"></div>
      <p class="sub" style="font-size:12px;margin-top:14px;">Tip: from a blocked page, click <b>Add to whitelist</b> there — it opens here with the domain prefilled.</p>
    </div>
  </main>
  <script src="/scripts/api.js"></script>
  <script>
  (function(){
    var params = new URLSearchParams(window.location.search);
    var d = params.get("domain") || params.get("url") || "";
    if (d) {
      try { d = new URL(d).hostname || d; } catch(e){}
      document.getElementById("domain").value = d;
    }
    // People paste "https://example.com/page" here. Extract the hostname so
    // the stored entry matches the real site instead of a mangled string.
    function hostname(v){
      var s = (v || "").trim();
      if (!s) return "";
      try {
        return new URL(s.indexOf("://") === -1 ? "https://" + s : s).hostname.toLowerCase() || s;
      } catch(e){ return s; }
    }
    document.getElementById("add").addEventListener("click", function(){
      var domain = hostname(document.getElementById("domain").value);
      var notes = document.getElementById("notes").value.trim();
      var msg = document.getElementById("msg");
      if (!domain) { msg.textContent = "Enter a domain."; msg.style.color="#ff9f9f"; return; }
      msg.textContent = "Adding…"; msg.style.color="#8aa4c2";
      API.selfAddTrusted({ domain: domain, category: "User Whitelisted", notes: notes }).then(function(r){
        var added = r.normalized_domain || domain;
        msg.textContent = "Added " + added + " to whitelist — it will no longer be blocked. Refresh the site.";
        msg.style.color="#5ede8f";
        document.getElementById("domain").value = "";
        // Tell the browser extension (if it is running) so it drops its cached
        // block verdict and refreshes its rule list right now, instead of
        // waiting out the 10-minute verdict cache / 30-minute rule refresh.
        try {
          document.documentElement.setAttribute("data-phishguard-whitelisted", added);
          window.dispatchEvent(new CustomEvent("phishguard-whitelisted", { detail: { domain: added } }));
        } catch(e){}
      }).catch(function(e){
        msg.textContent = "Failed: " + e.message;
        msg.style.color="#ff9f9f";
        if (e.message.indexOf("session") !== -1 || e.message.indexOf("401") !== -1) {
          setTimeout(function(){ window.location.href="/app/login.html"; }, 1200);
        }
      });
    });
  })();
  </script>
</body>
</html>
